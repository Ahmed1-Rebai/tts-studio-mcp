[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-app"
version = "2.0.0"
description = "Smart multi-engine Text-to-Speech app, video narration pipeline, voice training toolkit, and MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "edge-tts>=7.3.1",
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
gui = [
    "PyQt5>=5.15.9",
]
xtts = [
    "torch",
    "torchaudio",
    "torchcodec",
    "coqui-tts>=0.27.5",
    "coqui-tts-trainer>=0.3.3",
    "transformers<5",
]
training-asr = [
    "faster-whisper>=1.0.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[project.scripts]
tts-app = "tts_app.gui:main"
tts-cli = "tts_app.cli:main"
tts-mcp = "tts_app.mcp_server:main"

[tool.setuptools.packages.find]
include = ["tts_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "ARG", "B", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tts_app/gui.py" = ["E402"]
